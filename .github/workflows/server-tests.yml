name: Test Zeni IA server

on:
  push:
    branches: [zeni-openai-server]
  pull_request:
    branches: [zeni-online-gemini]
    paths:
      - "server/**"
      - ".github/workflows/server-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas del servidor
        run: npm test
