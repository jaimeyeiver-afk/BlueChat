name: Build Zeni IA APK (copia)

on:
  push:
    branches: [main, fix/streaming-replies]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk ZeniIA-J4-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZeniIA-J4-test
          path: ZeniIA-J4-test.apk
