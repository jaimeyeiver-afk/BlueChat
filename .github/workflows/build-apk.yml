name: Build Zeni IA APK (copia 32 bits, con internet)

on:
  push:
    branches: [main, zeni-ia-internet]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      # Opcional: si guardas el secreto GOOGLE_SERVICES_JSON en GitHub, se usa en lugar del archivo del repositorio.
      - name: Firebase (secreto opcional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Usando google-services.json del secreto."
          else
            echo "Usando app/google-services.json del repositorio."
          fi
      - name: Compilar APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk ZeniIA-internet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZeniIA-internet
          path: ZeniIA-internet.apk
